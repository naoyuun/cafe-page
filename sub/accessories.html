<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>pearl tide</title>
        <link rel="icon" href="../img/favicon.ico" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;1,300&family=Noto+Serif+JP&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../css/reset.css" />
        <!-- <link rel="stylesheet" href="css/base.css" /> -->
        <link rel="stylesheet" href="../css/style.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
        />
    </head>
    <body>
        <header class="header">
            <div class="header__inner">
                <h1 class="header__logo">
                    <img src="../img/logo.webp" alt="logo" />
                </h1>
                <!--ハンバーガ　ナビ追加-->
                <button class="header__hamburger" aria-label="メニュー">
                    <img src="../img/icon.webp" alt="menu icon" />
                </button>
            </div>
            <nav class="header__nav">
                <a href="../index.html">Top</a>
                <!-- <a href="#gift">Gift</a> -->
                <a href="menu.html">Menu</a>

                <!-- 泡 -->
                <span class="header__bubble header__bubble--1"></span>
                <span class="header__bubble header__bubble--2"></span>
                <span class="header__bubble header__bubble--3"></span>
            </nav>
        </header>
        <main class="accessorieshtml">
            <p>5000円（税抜）以上ご購入で送料無料</p>
            <nav class="breadcrumb" aria-label="パンくずリスト">
                <ol class="breadcrumb__list">
                    <li class="breadcrumb__item">
                        <a href="../index.html">TOP</a>
                    </li>
                    <li class="breadcrumb__item">
                        <a href="accessories.html">GIFT</a>
                    </li>
                </ol>
            </nav>
            <div class="pc-container">
                <div class="pc-item pc-item__1">
                    <div class="gift-carousel">
                        <input type="radio" name="gift" id="gift1" checked />
                        <input type="radio" name="gift" id="gift2" />
                        <!-- メイン画像表示エリア -->
                        <div class="gift-main">
                            <div class="gift-images">
                                <img
                                    src="../img/accessories.webp"
                                    alt="ブレスレット"
                                    class="gift-image"
                                />
                                <img
                                    src="../img/accessories2.webp"
                                    alt="テスター"
                                    class="gift-image"
                                />
                            </div>
                        </div>

                        <!-- サムネイルナビゲーション -->
                        <div class="gift-thumbnails">
                            <label for="gift1" class="thumbnail">
                                <img src="../img/accessories.webp" alt="サムネイル1" />
                            </label>
                            <label for="gift2" class="thumbnail">
                                <img src="../img/accessories2.webp" alt="サムネイル2" />
                            </label>
                        </div>
                    </div>

                    <div class="gift__info">
                        <p class="gift__brand">Pearl Tide チャーム付きブレスレット <br />５種</p>
                        <div class="gift__purchase">
                            <p class="gift__price">￥1,680(税込)</p>
                            <label for="gift-quantity">種類</label>
                            <select id="gift-quantity" class="gift__select" name="gift-quantity">
                                <option value="6">1番</option>
                                <option value="7">2番</option>
                                <option value="8">3番</option>
                                <option value="9">4番</option>
                                <option value="10">5番</option>
                            </select>
                        </div>
                        <button type="button" class="cart-btn">カートに入れる</button>
                    </div>
                </div>

                <div class="pc-item pc-item__2">
                    <div class="gift-expain">
                        <h4>商品説明</h4>
                        <ol>
                            <li>貝殻</li>
                            <li>ヒトデ</li>
                            <li>貝殻ビーズ付き</li>
                            <li>ヒトデビーズ付き</li>
                            <li>しずく型チャーム</li>
                        </ol>
                    </div>
                    <div class="gift-spec">
                        <h4>商品仕様</h4>
                        <p>長さ約20cm</p>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <a href="#" class="footer__button">
                <img src="../img/icons8-インスタグラム-48.png" alt="insta" />
            </a>
            <p class="footer__copy">&copy;Pearl Tide Cafe-HP</p>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <script src="../script.js"></script>
    </body>
</html>
